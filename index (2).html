<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Halloweenska igra ekipe Gemini: prevzemi nočno izmeno v Luki Koper ali Luki Rijeka in ujemi strašljiv tovor.">
<meta property="og:type" content="website">
<meta property="og:title" content="Gemini nočna izmena – halloweenska igra">
<meta property="og:description" content="Izberi vlogo, prevzemi nočno izmeno v Luki Koper ali Luki Rijeka in ujemi strašljiv tovor. Koliko točk zbereš?">
<meta property="og:image" content="https://gemini.si/halloween/nahled.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:url" content="https://gemini.si/halloween/">
<meta name="twitter:card" content="summary_large_image">
<title>Gemini nočna izmena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&family=Rubik+Wet+Paint&display=swap">
<style>
/* Layout: one night-port stage (skyline per port, quay + rail lanes, sea, scare layer) with story/role panels on top; slim header and footer; single dark theme by choice */
:root{
  --night:#0d1626;
  --quay:#2a3242;
  --steel:#8fa3bf;
  --ink:#eef2f8;
  --muted:#9aa8bd;
  --pumpkin:#ff7a1a;
  --pumpkin-soft:#ffb066;
  --ghost:#d9f5e6;
  --bad:#ff4d5e;
  --good:#5fe39a;
  --brand:#2b1d4f;
  --display:"Rubik Wet Paint", "Barlow Condensed", Impact, sans-serif;
  --stencil:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
}
.wrap{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--stencil);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.logochip{background:#fff;border-radius:8px;padding:3px 8px;display:inline-flex}
.logochip img{height:34px;width:auto;display:block}
.cardlogo{background:#fff;border-radius:12px;padding:8px 16px;display:inline-flex}
.cardlogo img{height:60px;width:auto;display:block}
.controls{display:flex;gap:4px;flex-wrap:wrap}
.controls button{font-family:var(--stencil);font-weight:700;letter-spacing:.1em;background:transparent;color:var(--muted);border:1px solid var(--quay);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:14px;text-transform:uppercase}
.controls button[aria-pressed="true"]{color:var(--night);background:var(--pumpkin);border-color:var(--pumpkin)}
button:focus-visible{outline:2px solid var(--pumpkin-soft);outline-offset:2px}

.hud{display:flex;gap:16px;align-items:center;font-family:var(--stencil);text-transform:uppercase;letter-spacing:.08em}
.hud .stat{display:flex;flex-direction:column;line-height:1.1}
.hud .lbl{font-size:12px;color:var(--muted);font-weight:700}
.hud .val{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.hud .val.speedy{color:var(--pumpkin)}
.hudav{width:40px;height:40px;border-radius:50%;background:#1e1636;border:2px solid var(--pumpkin);overflow:hidden;flex:none}
.hudav svg{width:100%;height:100%;display:block}
.lives{display:flex;gap:3px;align-items:center;height:28px}
.lives svg{width:20px;height:20px;transition:opacity .3s, transform .3s}
.lives svg.lost{opacity:.18;transform:scale(.8)}

/* port scenes */
.stage{
  --sky1:#0a1220;--sky2:#162238;--sky3:#1b2a44;--crane:#4a5e80;--hill:#0e1828;--mtn:#152238;
  --moon1:#fff6dc;--moon2:#f1d9a0;--moonglow:rgba(255,220,150,.25);--sea1:#10203a;--sea2:#132744;--seaedge:#24406a;
  position:relative;flex:1;min-height:480px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.stage.rijeka{
  --sky1:#0b0817;--sky2:#22163c;--sky3:#3a2550;--crane:#8f3d3d;--hill:#120c22;--mtn:#1d1433;
  --moon1:#f2ffe4;--moon2:#a9dc93;--moonglow:rgba(160,230,140,.28);--sea1:#0f2a2c;--sea2:#123334;--seaedge:#1f5a55;
}
.stage.hit{animation:flash .35s}
@keyframes flash{0%{box-shadow:inset 0 0 0 0 var(--bad)}30%{box-shadow:inset 0 0 0 6px var(--bad)}100%{box-shadow:inset 0 0 0 0 var(--bad)}}
.stage.quake{animation:quake .45s}
@keyframes quake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.sky{position:absolute;inset:0;pointer-events:none}
.moon{position:absolute;top:22px;right:9%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 38% 38%,var(--moon1),var(--moon2) 70%);box-shadow:0 0 60px 10px var(--moonglow)}
.skyline{position:absolute;left:0;right:0;top:20px;height:140px}
.skyline .crane{fill:none;stroke:var(--crane);stroke-width:5}
.skyline .cranefill{fill:var(--crane)}
.skyline .hill{fill:var(--hill)}
.skyline .mtn{fill:var(--mtn)}
.skyline .lit{fill:#ffd23a}
.fog{position:absolute;left:0;right:0;bottom:36px;height:120px;background:linear-gradient(0deg,rgba(140,110,190,.18),transparent)}
.billboard{position:absolute;top:14px;left:16px;background:#fff;border-radius:8px;padding:6px 10px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 0 30px rgba(255,122,26,.35);border:3px solid var(--brand);z-index:1}
.billboard img{height:62px;width:auto;display:block}
.billboard span{font-family:var(--stencil);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
.sea{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(90deg,var(--sea1) 0 18px,var(--sea2) 18px 36px);border-top:2px solid var(--seaedge)}
.lane{position:absolute;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--steel) 0 26px,transparent 26px 44px);opacity:.25}
.rail{position:absolute;left:0;right:0;height:12px;opacity:.75;
  background:linear-gradient(#a9b6c9,#a9b6c9) 0 1px/100% 2px no-repeat,linear-gradient(#a9b6c9,#a9b6c9) 0 9px/100% 2px no-repeat,repeating-linear-gradient(90deg,#6a4a30 0 7px,transparent 7px 18px)}
.rail.new{animation:railIn .8s ease-out}
@keyframes railIn{from{transform:scaleX(0);transform-origin:right}to{transform:scaleX(1);transform-origin:right}}

/* containers */
.box{position:absolute;left:0;top:0;border-radius:4px;cursor:pointer;will-change:transform;display:flex;align-items:stretch;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.box .ribs{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:5px 8px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 3px,rgba(0,0,0,.12) 3px 9px)}
.box .code{font-family:var(--stencil);font-weight:800;font-size:17px;letter-spacing:.22em;color:rgba(255,255,255,.92);white-space:nowrap;line-height:1.1}
.box .meta{font-family:var(--stencil);font-weight:500;font-size:10px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em;color:rgba(255,255,255,.7);white-space:nowrap}
.box.small .code{font-size:13px;letter-spacing:.16em}
.box.small .meta{font-size:9px}
.box .door{flex:none;width:34%;border-left:2px solid rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.10) 3px 8px)}
.box .door svg{width:78%;height:78%}
.box.spooky{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 rgba(255,122,26,0)}to{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 22px rgba(255,122,26,.6)}}
.box.flat{background:none!important;box-shadow:none;overflow:visible;border-radius:0}
.box.flat svg.fr{display:block;width:100%;height:100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.box.flat.spooky{animation:glowf 1.2s ease-in-out infinite alternate}
@keyframes glowf{from{filter:drop-shadow(0 0 0 rgba(255,122,26,0))}to{filter:drop-shadow(0 0 12px rgba(255,122,26,.85))}}
.box.onrail{overflow:visible;box-shadow:none}
.bogie{position:absolute;left:3%;right:3%;bottom:-11px;height:11px;pointer-events:none;
  background:radial-gradient(circle,#0b0b0b 0 3.5px,#7b8aa0 3.5px 5px,transparent 5.5px) 0 0/25% 100% repeat-x,linear-gradient(#2a2f38,#2a2f38) 0 0/100% 3px no-repeat}
.box.caught{transition:opacity .45s, filter .45s;opacity:0;filter:brightness(2)}
.box.wrong{animation:shake .3s}
@keyframes shake{25%{margin-left:-5px}75%{margin-left:5px}}
.stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--stencil);font-weight:800;font-size:18px;letter-spacing:.12em;color:var(--good);background:rgba(10,18,32,.55);text-transform:uppercase}

.pop{position:absolute;font-family:var(--stencil);font-weight:800;font-size:22px;pointer-events:none;animation:rise .8s ease-out forwards;white-space:nowrap;z-index:3}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;z-index:3;animation:bannerIn 1.6s ease-out forwards;display:flex;flex-direction:column;align-items:center;gap:2px}
.banner b{font-family:var(--display);font-weight:400;font-size:clamp(36px,8vw,60px);color:var(--pumpkin);text-shadow:0 0 20px rgba(255,122,26,.6);line-height:1}
.banner small{font-family:var(--stencil);font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 2px 6px #000}
@keyframes bannerIn{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}

/* jump scares */
#scare{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bigghost{position:absolute;left:50%;top:50%;width:min(70%,420px);aspect-ratio:1;max-width:100%;transform:translate(-50%,-50%);animation:boo 1.15s cubic-bezier(.2,1.4,.4,1) forwards}
.bigghost svg{width:100%;height:100%}
.bigghost b{position:absolute;left:0;right:0;bottom:-6%;text-align:center;font-family:var(--display);font-weight:400;font-size:clamp(48px,12vw,96px);color:#fff;text-shadow:0 0 24px rgba(255,255,255,.6),0 4px 0 #000}
@keyframes boo{0%{transform:translate(-50%,10%) scale(.15);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-60%) scale(1.35);opacity:0}}
.bat{position:absolute;width:56px;height:56px;animation:fly 1.7s linear forwards}
@keyframes fly{0%{transform:translateX(-80px) translateY(0)}25%{transform:translateX(25vw) translateY(-26px)}50%{transform:translateX(50vw) translateY(18px)}75%{transform:translateX(75vw) translateY(-22px)}100%{transform:translateX(calc(100vw + 80px)) translateY(10px)}}
.dark{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.78),rgba(0,0,0,.95));animation:darkIn 2.1s ease-in-out forwards}
@keyframes darkIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.eyes{position:absolute;width:70px;height:30px;animation:blink 1.8s steps(1) forwards}
.eyes svg{width:100%;height:100%}
@keyframes blink{0%,30%,36%,100%{opacity:1}31%,35%{opacity:0}}
.hand{position:absolute;bottom:-10px;width:min(34%,220px);animation:grab 1.3s ease-out forwards}
@keyframes grab{0%{transform:translateY(100%)}30%{transform:translateY(0)}70%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(110%)}}

/* reefer + frost ghost */
.box.reefer{background:#e4ebf2!important}
.box.reefer .ribs{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 3px,rgba(255,255,255,.5) 3px 9px)}
.box.reefer .code{color:var(--brand)}
.box.reefer .meta{color:#3c5a7a}
.box.reefer .unit{flex:none;width:24%;background:#9fb3c8;border-right:2px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px)}
.box.reefer .unit svg{width:70%;height:70%}
.box.reefer.open{box-shadow:0 0 30px rgba(170,225,255,.9)}
#freeze{position:absolute;inset:0;z-index:4;cursor:crosshair;overflow:hidden;
  background:radial-gradient(ellipse at center,rgba(170,225,255,.06) 35%,rgba(205,240,255,.6) 100%);
  box-shadow:inset 0 0 70px rgba(225,248,255,.95);animation:freezeIn .45s ease-out}
@keyframes freezeIn{from{opacity:0}to{opacity:1}}
#freeze.melt{animation:melt .6s ease-in forwards;pointer-events:none}
@keyframes melt{to{opacity:0;transform:translateY(20px)}}
.frosttitle{position:absolute;left:0;right:0;top:0;padding:10px 12px;background:linear-gradient(180deg,rgba(10,40,70,.75),rgba(10,40,70,0));z-index:1;text-align:center;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.frosttitle b{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,54px);color:#dff6ff;text-shadow:0 0 18px #7fd4ff,0 3px 0 #1d4f78;line-height:1}
.frosttitle span{font-family:var(--stencil);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 2px 6px #000;font-size:15px}
.frostghost{position:absolute;left:0;top:0;width:110px;height:140px;transform-origin:55px 140px;cursor:pointer;touch-action:manipulation}
.frostghost svg{width:100%;height:100%;display:block}
.frostghost.ouch svg{animation:ouch .22s}
@keyframes ouch{50%{transform:translateX(-6px) rotate(-6deg);filter:brightness(1.8)}}
.hp{position:absolute;left:10px;right:10px;top:-14px;height:8px;border-radius:4px;background:rgba(0,0,0,.55);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d5e,#ffb066);transition:width .15s}
.candy{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;transition:transform .28s cubic-bezier(.3,.6,.4,1)}
.candy svg{width:100%;height:100%}

/* crows (title + story) */
.crows{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.crow{position:absolute;left:0;width:64px;height:40px;animation:crowfly linear infinite}
.crow svg{width:100%;height:100%;overflow:visible}
.crow .wing{transform-origin:32px 22px;animation:flap .32s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.55)}}
@keyframes crowfly{0%{transform:translate(-90px,0)}30%{transform:translate(30vw,-18px)}60%{transform:translate(60vw,14px)}100%{transform:translate(calc(100vw + 90px),-8px)}}

/* panels */
.panel{position:absolute;inset:0;display:flex;padding:18px;background:radial-gradient(ellipse at center,rgba(13,22,38,.80),rgba(13,22,38,.96));z-index:5;overflow-y:auto}
.card{max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin:auto;position:relative}
.eyebrow{font-family:var(--stencil);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--pumpkin-soft);font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,72px);line-height:1;margin:0;color:var(--pumpkin);text-wrap:balance;letter-spacing:.02em;text-shadow:0 0 24px rgba(255,122,26,.35)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1;margin:0;color:var(--pumpkin);text-wrap:balance}
.card p{margin:0;color:var(--muted);max-width:44ch}
#title .card h1{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 40px rgba(255,122,26,.75)}}
.cta{font-family:var(--stencil);font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase;background:var(--pumpkin);color:#1a0d02;border:0;border-radius:8px;padding:12px 28px;cursor:pointer;box-shadow:0 5px 0 #a8460a}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #a8460a}
.ghostbtn{font-family:var(--stencil);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--steel);border-radius:8px;padding:9px 18px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* story */
.story{width:100%;min-height:9.5em;background:rgba(5,8,16,.72);border:1px solid #3a2a52;border-radius:12px;padding:18px 20px;text-align:left;font-size:19px;line-height:1.5;color:#e9e2f5;box-shadow:0 0 40px rgba(91,42,134,.35)}
.story::after{content:"▌";color:var(--pumpkin);animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--quay)}
.dots i.on{background:var(--pumpkin)}
.truckscene{position:absolute;left:0;right:0;bottom:34px;height:90px;pointer-events:none;overflow:hidden}
.truck{position:absolute;bottom:0;left:0;width:260px;height:80px;animation:drive 9s linear infinite}
.truck svg{width:100%;height:100%;overflow:visible}
@keyframes drive{from{transform:translateX(-300px)}to{transform:translateX(calc(100vw + 60px))}}

/* roles */
.gender{display:flex;gap:6px}
.gender button,.portbtn,.rolebtn{font-family:var(--stencil);background:rgba(255,255,255,.04);border:2px solid var(--quay);border-radius:10px;cursor:pointer;color:var(--ink)}
.gender button{font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:16px;padding:6px 18px}
.gender button[aria-pressed="true"],.portbtn[aria-pressed="true"],.rolebtn[aria-pressed="true"]{border-color:var(--pumpkin);background:rgba(255,122,26,.12);box-shadow:0 0 18px rgba(255,122,26,.25)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.rolebtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;text-align:center}
.rolebtn .av{width:86px;height:92px}
.rolebtn .av svg{width:100%;height:100%;display:block}
.rolebtn strong{font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.rolebtn span{font-family:var(--body);font-size:12.5px;color:var(--muted);line-height:1.3}
.ports{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.portbtn{text-align:left;padding:8px 14px;display:flex;flex-direction:column;gap:0}
.portbtn strong{font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.portbtn span{font-size:13px;color:var(--muted);letter-spacing:.06em}
.picklbl{font-family:var(--stencil);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);align-self:flex-start}

/* rules */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.rules li{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--quay);border-radius:10px;padding:7px 12px}
.rules li.key{border-color:#7fd4ff;background:rgba(127,212,255,.08)}
.rules svg{width:56px;height:32px}
.rules div{min-width:0;font-size:14.5px;line-height:1.35;color:var(--ink)}
.rules strong{font-family:var(--stencil);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px;display:block;color:var(--pumpkin-soft)}
.rules li.key strong{color:#9fe0ff}
.perkline{font-size:14px;color:var(--ink);background:rgba(255,122,26,.12);border:1px solid var(--pumpkin);border-radius:10px;padding:8px 12px;width:100%;display:flex;gap:10px;align-items:center;text-align:left}
.perkline .av{width:40px;height:44px;flex:none}
.perkline .av svg{width:100%;height:100%}

/* game over */
.big{font-family:var(--stencil);font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.rank{font-family:var(--stencil);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ghost)}
.overav{width:84px;height:90px}
.overav svg{width:100%;height:100%}
.best{font-size:14px;color:var(--muted);font-family:var(--stencil);letter-spacing:.08em;text-transform:uppercase}
.copied{font-size:13px;color:var(--good);min-height:1.2em}

footer{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
footer a{color:var(--pumpkin-soft)}
footer .right{display:flex;gap:14px;align-items:baseline}
.credit{font-size:10px;letter-spacing:.06em;opacity:.45}
@media (max-width:520px){
  .hud .val{font-size:20px}.hud{gap:10px}.hud .lbl{font-size:11px}
  .billboard img{height:48px}.cardlogo img{height:46px}
  .story{font-size:17px}
  .rolebtn .av{width:70px;height:76px}.rolebtn strong{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .box.spooky,.box.flat.spooky,#title .card h1{animation:none}.box.spooky{box-shadow:0 0 0 2px var(--pumpkin)}
  .bigghost,.bat,.hand,.stage.quake{animation-duration:.01s}
  .crow,.truck{animation-duration:30s}
}
</style>

  /* ---------- sound ---------- */
  let actx=null, master=null, ambient=null;
  function audio(){
    try{
      if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=soundOn?1:0; master.connect(actx.destination); }
      if(actx.state==="suspended") actx.resume();
      return actx;
    }catch(e){return null;}
  }
  function tone(f1,f2,dur,type,vol,delay){
    const a=actx; if(!a||!soundOn) return; const t=a.currentTime+(delay||0);
    const o=a.createOscillator(), g=a.createGain(); o.type=type||"sine";
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(master); o.start(t); o.stop(t+dur+.02);
  }
  function noiseBuf(sec){ const b=actx.createBuffer(1,actx.sampleRate*sec,actx.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
  function noise(dur,vol,freq){
    const a=actx; if(!a||!soundOn) return; const t=a.currentTime;
    const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=freq||1400;
    s.buffer=noiseBuf(dur); g.gain.setValueAtTime(vol||.35,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f).connect(g).connect(master); s.start(t);
  }
  function caw(delay){
    const a=actx; if(!a||!soundOn) return;
    [0,.38].forEach(off=>{
      const t=a.currentTime+(delay||0)+off;
      const o=a.createOscillator(), lfo=a.createOscillator(), lg=a.createGain(), bp=a.createBiquadFilter(), g=a.createGain();
      o.type="sawtooth"; o.frequency.setValueAtTime(560,t); o.frequency.exponentialRampToValueAtTime(330,t+.26);
      lfo.frequency.value=38; lg.gain.value=70; lfo.connect(lg).connect(o.frequency);
      bp.type="bandpass"; bp.frequency.value=1100; bp.Q.value=1.6;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.32,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+.3);
      o.connect(bp).connect(g).connect(master); o.start(t); lfo.start(t); o.stop(t+.32); lfo.stop(t+.32);
    });
  }
  function moan(){ const a=actx; if(!a||!soundOn) return; const t=a.currentTime;
    const o=a.createOscillator(), v=a.createOscillator(), vg=a.createGain(), g=a.createGain();
    o.type="sine"; o.frequency.setValueAtTime(620,t); o.frequency.linearRampToValueAtTime(880,t+1.4); o.frequency.linearRampToValueAtTime(540,t+2.8);
    v.frequency.value=5.5; vg.gain.value=14; v.connect(vg).connect(o.frequency);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.07,t+.7); g.gain.linearRampToValueAtTime(.0001,t+2.8);
    o.connect(g).connect(master); o.start(t); v.start(t); o.stop(t+2.9); v.stop(t+2.9);
  }
  function startAmbient(){
    if(!actx||ambient) return;
    const a=actx, out=a.createGain(); out.gain.value=0; out.connect(master);
    out.gain.linearRampToValueAtTime(1,a.currentTime+2.5);
    const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=260; lp.connect(out);
    [55,55.8,82.4].forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type=i<2?"sawtooth":"triangle"; o.frequency.value=f; g.gain.value=i<2?.05:.03; o.connect(g).connect(lp); o.start(); });

    const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=480; bp.Q.value=.8;

    const wl=a.createOscillator(), wlg=a.createGain(); wl.frequency.value=.07; wlg.gain.value=260; wl.connect(wlg).connect(bp.frequency); wl.start();

    if(instant){ el.textContent=txt; typing=null; return; }
    let i=0; el.textContent="";
    typing=setInterval(()=>{ i+=1; el.textContent=txt.slice(0,i); if(i%3===0) tone(1400+Math.random()*400,1200,.02,"square",.015); if(i>=txt.length){clearInterval(typing);typing=null;} },32);
  }
  $("enter").onclick=()=>{ audio(); startAmbient(); caw(); setTimeout(()=>caw(),900); page=0; show("storyPanel"); typeStory(); };
  $("storyNext").onclick=()=>{
    if(typing){ typeStory(true); return; }
    page++;
    if(page>=T[lang].story.length){ show("rolesPanel"); caw(); return; }
    if(page===2) caw(); if(page===1) moan();
    typeStory();
  };
  $("skip").onclick=()=>{ clearInterval(typing); typing=null; show("rolesPanel"); };
  $("rolesNext").onclick=()=>{ show("howto"); };

  /* ---------- game field ---------- */
  function renderLives(){ $("lives").innerHTML=Array.from({length:maxLives},(_,i)=>PUMPKIN_LIFE.replace("<svg",`<svg class="${i<lives?"":"lost"}"`)).join(""); }
  function measure(animNew){
    W=stage.clientWidth; H=stage.clientHeight;
    const top=W<500?135:155, bottom=H-44, gap=(bottom-top)/laneCount;
    cw=Math.max(118,Math.min(160,W*0.24)); ch=cw*0.5;
    const maxCh=gap*(laneCount>3?0.7:0.8);
    if(ch>maxCh){ ch=maxCh; cw=ch*2; }
    lanesY=Array.from({length:laneCount},(_,i)=>top+gap*i+(gap-ch)/2-(i>=3?4:0));
    field.querySelectorAll(".lane,.rail").forEach(l=>l.remove());
    lanesY.forEach((y,i)=>{
      const l=document.createElement("div");
      if(i>=3){ l.className="rail"+(animNew&&i===laneCount-1?" new":""); l.style.top=(y+ch+3)+"px"; }
      else { l.className="lane"; l.style.top=(y+ch+8)+"px"; }
      field.insertBefore(l,field.firstChild);
    });
    boxes.forEach(b=>{b.el.style.width=cw+"px";b.el.style.height=ch+"px";b.el.classList.toggle("small",cw<130);b.el.style.transform=`translate(${b.x}px,${lanesY[b.lane]}px)`;});
  }
  window.addEventListener("resize",()=>measure(false));

  const code=()=>`GMNU ${Math.floor(Math.random()*900000)+100000} ${Math.floor(Math.random()*10)}`;
  // gentler start than before, still speeding up the whole shift (cap ×4.5)
  const mult=()=>Math.min(4.5,1+elapsed/32+Math.pow(elapsed/95,2));
  const speed=()=>(W*0.145+52)*mult()*(role==="captain"?0.9:1);

  function makeBox(spooky,flat){
    const t=T[lang], el=document.createElement("div");
    el.className="box"+(flat?" flat":"")+(spooky?" spooky":"")+(cw<130?" small":"");
    el.style.width=cw+"px"; el.style.height=ch+"px";
    const color=spooky?pick(SPOOKY_COLORS):pick(COLORS);
    if(flat) el.innerHTML=flatSVG(color, spooky?SPOOKY_CARGO[pick(Object.keys(SPOOKY_CARGO))]:CARGO[pick(Object.keys(CARGO))]);
    else{
      el.style.background=color;
      el.innerHTML=`<div class="ribs"><span class="code">GEMINI</span><span class="meta">${code()} · ${spooky?pick(t.spookyMeta):pick(t.meta)}</span></div><div class="door">${spooky?ICONS[pick(ICON_KEYS)]:""}</div>`;
    }
    return el;
  }
  function freeLane(){
    const order=[...Array(laneCount).keys()].sort(()=>Math.random()-.5);
    return order.find(l=>!boxes.some(b=>b.lane===l&&b.x>W-cw*1.3));
  }
  function attach(el,lane){ if(lane>=3){ el.classList.add("onrail"); const bg=document.createElement("div"); bg.className="bogie"; el.appendChild(bg);} }
  function spawn(){
    const lane=freeLane(); if(lane===undefined) return;
    const spooky=Math.random()<Math.min(0.55,0.38+elapsed/300);
    const el=makeBox(spooky,Math.random()<0.38); attach(el,lane);
    const b={el,lane,x:W+10,spooky,done:false};
    el.addEventListener("pointerdown",e=>{e.preventDefault();tap(b);});
    field.appendChild(el); boxes.push(b);
  }
  function spawnReefer(){
    const lane=freeLane(); if(lane===undefined) return false;
    const el=document.createElement("div"); el.className="box reefer"+(cw<130?" small":"");
    el.style.width=cw+"px"; el.style.height=ch+"px";
    el.innerHTML=`<div class="unit">${SNOW}</div><div class="ribs"><span class="code">GEMINI</span><span class="meta">REEFER · −18 °C</span></div>`;
    attach(el,lane);
    const b={el,lane,x:W+10,spooky:false,reefer:true,done:false};
    field.appendChild(el); boxes.push(b); return true;
  }
  function startFrost(b){
    frozen=true; scareLayer.innerHTML=""; scareBusy=false;
    b.el.classList.add("open");
    const t=T[lang], ov=document.createElement("div"); ov.id="freeze";
    ov.innerHTML=`<div class="frosttitle"><b>${t.freeze}</b><span>${t.freezeHint}</span></div><div class="frostghost"><div class="hp"><i style="width:100%"></i></div>${FROST_GHOST}</div>`;
    stage.appendChild(ov);
    const hp=Math.max(3,6+reeferCount*2-(role==="customs"?2:0));
    frost={ov,b,g:ov.querySelector(".frostghost"),bar:ov.querySelector(".hp i"),t:0,D:Math.max(4.8,8.5-reeferCount*0.8),hp,max:hp,
      sx:b.x+cw/2, sy:lanesY[b.lane]+ch/2, tx:W/2, ty:H-30};
    reeferCount++;
    ov.addEventListener("pointerdown",throwCandy);
    placeGhost(); SFX.freeze(); moan();
  }
  function placeGhost(){
    const f=frost, p=Math.min(1,f.t/f.D);
    let x=f.sx+(f.tx-f.sx)*p+Math.sin(f.t*2.6)*W*0.18*Math.min(1,p*2);
    x=Math.max(50,Math.min(W-50,x));
    f.g.style.transform=`translate(${x-55}px,${f.sy+(f.ty-f.sy)*p-140}px) scale(${0.45+2.1*p})`;
  }
  function throwCandy(e){
    e.preventDefault();
    if(!frost||state!=="play") return;
    const f=frost, r=stage.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    const hit=!!e.target.closest(".frostghost");
    const c=document.createElement("div"); c.className="candy"; c.innerHTML=pick(CANDIES);
    c.style.transform=`translate(${W/2-17}px,${H}px) rotate(0deg)`;
    f.ov.appendChild(c); SFX.toss();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${px-17}px,${py-17}px) rotate(${540+Math.random()*360}deg)`;}));
    setTimeout(()=>{
      c.remove();
      if(frost!==f||!hit) return;
      f.hp--; f.bar.style.width=(100*f.hp/f.max)+"%"; SFX.hit();
      f.g.classList.remove("ouch"); void f.g.offsetWidth; f.g.classList.add("ouch");
      if(f.hp<=0) endFrost(true);
    },290);
  }
  function endFrost(win){
    const f=frost; if(!f) return; frost=null; frozen=false;
    f.ov.classList.add("melt"); setTimeout(()=>f.ov.remove(),620);
    f.b.done=true; f.b.el.classList.add("caught"); setTimeout(()=>f.b.el.remove(),460);
    if(win){ score+=50; frostWins++; $("score").textContent=score; SFX.win(); banner(T[lang].thawed,"",true); }
    else loseLife();
  }

  function pop(x,y,text,color){
    const p=document.createElement("div");p.className="pop";p.textContent=text;p.style.color=color;
    p.style.left=x+"px";p.style.top=y+"px";field.appendChild(p);setTimeout(()=>p.remove(),850);
  }
  function tap(b){
    if(state!=="play"||b.done||b.reefer||frozen) return;
    const t=T[lang];
    if(b.spooky){
      const pts=(role==="train"&&b.lane>=3)?20:10;
      b.done=true; score+=pts; caught++; SFX.caught();
      const s=document.createElement("div");s.className="stamp";s.textContent=t.caught;b.el.appendChild(s);
      b.el.classList.add("caught");
      pop(b.x+cw/2-14,lanesY[b.lane]-10,"+"+pts,"var(--good)");
      setTimeout(()=>b.el.remove(),460);
    }else{
      score=Math.max(0,score-5); mistakes++; SFX.wrong();
      b.el.classList.remove("wrong"); void b.el.offsetWidth; b.el.classList.add("wrong");
      pop(b.x+cw/2-30,lanesY[b.lane]-10,t.delay,"var(--bad)");
    }
    $("score").textContent=score;
  }

  function quake(){ stage.classList.remove("quake"); void stage.offsetWidth; stage.classList.add("quake"); }
  function scare(kind){
    if(scareBusy) return; scareBusy=true;
    const done=ms=>setTimeout(()=>{scareLayer.innerHTML="";scareBusy=false;},ms);
    if(kind==="ghost"){
      const g=document.createElement("div");g.className="bigghost"; g.style.left=(30+Math.random()*40)+"%";
      g.innerHTML=BIG_GHOST+`<b>${T[lang].boo}</b>`; scareLayer.appendChild(g); SFX.scare(); quake(); done(1200);
    }else if(kind==="bats"){
      for(let i=0;i<10;i++){
        const b=document.createElement("div");b.className="bat";b.innerHTML=BAT_SVG;
        b.style.top=(120+Math.random()*(H-200))+"px"; b.style.animationDelay=(i*0.07)+"s"; b.style.width=b.style.height=(40+Math.random()*40)+"px";
        scareLayer.appendChild(b);
      }
      SFX.bats(); done(2600);
    }else if(kind==="crows"){
      const c=document.createElement("div"); c.className="crows"; scareLayer.appendChild(c); fillCrows(c,7);
      c.querySelectorAll(".crow").forEach(k=>{k.style.animationDuration=(2.2+Math.random())+"s";k.style.animationDelay=(Math.random()*.6)+"s";k.style.top=(20+Math.random()*60)+"%";});
      caw(); caw(.5); done(3200);
    }else if(kind==="dark"){
      const d=document.createElement("div");d.className="dark";scareLayer.appendChild(d);
      for(let i=0;i<4;i++){
        const e=document.createElement("div");e.className="eyes";e.innerHTML=EYES_SVG;
        e.style.left=(8+Math.random()*75)+"%";e.style.top=(18+Math.random()*60)+"%";e.style.animationDelay=(i*0.2)+"s";d.appendChild(e);
      }
      SFX.dark(); done(2150);
    }else if(kind==="hand"){
      const h=document.createElement("div");h.className="hand";h.innerHTML=HAND_SVG;
      h.style.left=(10+Math.random()*55)+"%";scareLayer.appendChild(h); SFX.scare(); quake(); done(1350);
    }
  }
  const randomScare=()=>scare(pick(["ghost","bats","dark","hand","ghost","crows"]));

  function banner(text,sub,quiet){
    const b=document.createElement("div");b.className="banner";
    b.innerHTML=`<b></b>${sub?"<small></small>":""}`; b.querySelector("b").textContent=text; if(sub) b.querySelector("small").textContent=sub;
    field.appendChild(b); setTimeout(()=>b.remove(),1650); if(!quiet) SFX.faster();
  }
  function levelUp(n){
    level=n; $("level").textContent=n;
    if(laneCount<5){ laneCount++; measure(true); }
    banner(T[lang].levelUp(n),T[lang].levelSub(n),true); SFX.level();
  }
  function loseLife(){
    lives--; renderLives(); SFX.lose();
    stage.classList.remove("hit"); void stage.offsetWidth; stage.classList.add("hit");
    if(lives>0) scare("ghost"); else end();
  }

  function loop(ts){
    if(state!=="play") return;
    const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
    if(frozen){
      frost.t+=dt; placeGhost();
      if(frost.t>=frost.D) endFrost(false);
      if(state==="play") raf=requestAnimationFrame(loop);
      return;
    }
    elapsed+=dt;
    const lv=1+Math.floor(elapsed/30); if(lv>level) levelUp(lv);
    if(elapsed>=nextReefer && !boxes.some(b=>b.reefer)){ if(spawnReefer()) nextReefer=elapsed+22+Math.random()*8; }
    spawnT-=dt;
    if(spawnT<=0){ spawn(); spawnT=Math.max(0.4,1.3-elapsed/55)*(0.75+Math.random()*0.5)*Math.sqrt(3/laneCount); }
    if(elapsed>=nextScare){ randomScare(); nextScare=elapsed+Math.max(4,9-elapsed/18)+Math.random()*4; }
    if(elapsed>=nextBanner){ if(elapsed%30>5) banner(T[lang].faster); nextBanner+=15; }
    const m=mult(); const sp=$("speed"); sp.textContent="×"+m.toFixed(1); sp.classList.toggle("speedy",m>=2);
    const v=speed();
    for(const b of boxes){
      if(!b.el.isConnected) continue;
      if(!b.done) b.x-=v*dt;
      b.el.style.transform=`translate(${b.x}px,${lanesY[b.lane]}px)`;
      if(b.reefer&&!b.done&&b.x<W*0.5){ startFrost(b); break; }
      if(!b.done&&b.x<-cw){
        b.done=true; b.el.remove();
        if(b.spooky) loseLife();
        if(state!=="play") return;
      }
    }
    boxes=boxes.filter(b=>b.el.isConnected);
    raf=requestAnimationFrame(loop);
  }

  function clearField(){ boxes.forEach(b=>b.el.remove()); boxes=[]; scareLayer.innerHTML=""; scareBusy=false; const fz=$("freeze"); if(fz) fz.remove(); frost=null; frozen=false; }
  function start(){
    audio(); startAmbient(); ambientLevel(.45);
    clearField();
    maxLives=role==="truck"?4:3;
    score=0;lives=maxLives;caught=0;mistakes=0;elapsed=0;spawnT=0.3;level=1;laneCount=3;
    nextScare=7+Math.random()*3;nextBanner=15;nextReefer=13+Math.random()*5;reeferCount=0;frostWins=0;
    $("score").textContent="0"; $("level").textContent="1"; $("speed").textContent="×1.0"; $("speed").classList.remove("speedy");
    renderLives(); renderAvatars(); measure(false);
    show(null); $("copied").textContent="";
    state="play"; last=performance.now(); raf=requestAnimationFrame(loop);
  }
  const rankFor=s=>{const r=T[lang].ranks[gender]; return s>=360?r[3]:s>=200?r[2]:s>=80?r[1]:r[0];};
  function showOver(){
    const t=T[lang];
    $("final").textContent=score; $("rank").textContent=`${roleName(role,gender)} · ${rankFor(score)}`;
    $("summary").textContent=t.summary(caught,mistakes,t.portName(port),frostWins,gender);
    $("bestOver").textContent=`${t.reached}: ${level} · ${t.best}: ${best()}`;
  }
  function end(){
    state="over"; cancelAnimationFrame(raf); const fz=$("freeze"); if(fz) fz.remove(); frost=null; frozen=false;
    if(score>best()) store.set(bestKey(),score);
    ambientLevel(1);
    showOver(); show("over"); $("hud").hidden=false;
  }

  $("start").onclick=start;
  $("again").onclick=start;
  $("menu").onclick=()=>{ state="intro"; laneCount=3; measure(false); demo(); show("rolesPanel"); };
  $("copy").onclick=()=>{
    const t=T[lang], text=t.share(score,rankFor(score),t.portName(port),gender,roleName(role,gender));
    try{ navigator.clipboard.writeText(text).then(()=>{$("copied").textContent=t.copied;},()=>{$("copied").textContent=text;}); }
    catch(e){ $("copied").textContent=text; }
  };

  // sample cargo behind the intro panels so the first frame shows the game
  function demo(){
    clearField();
    [[0.10,0,false,false],[0.50,1,true,false],[0.72,2,false,true],[0.26,2,true,true],[0.70,0,true,true]].forEach(([fx,lane,sp,fl])=>{
      const el=makeBox(sp,fl); el.style.transform=`translate(${W*fx}px,${lanesY[lane]}px)`;
      field.appendChild(el); boxes.push({el,lane,x:W*fx,spooky:sp,done:true});
    });
  }
  measure(false); applyLang(); demo(); show("title");
})();
</script>

</body>
